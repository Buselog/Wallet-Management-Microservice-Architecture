<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet App - Yatırım Merkezi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .sidebar {
            background-color: #1e293b;
            min-height: 100vh;
            padding: 20px;
            border-right: 1px solid #334155;
        }

        .nav-link {
            color: #94a3b8;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .nav-link:hover {
            color: #f8fafc;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            background-color: #ef4444;
            color: white;
        }

        .investment-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .table {
            color: #f8fafc;
            border-color: #334155;
            margin-bottom: 0;
        }

        .table thead th {
            border-bottom: 2px solid #334155;
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.8rem;
            padding: 15px;
        }

        .table tbody tr {
            border-bottom: 1px solid #334155;
            transition: 0.2s;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background-color: #0f172a;
        }

        .table td {
            padding: 15px;
        }

        .currency-badge {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
        }

        .rate-val {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .btn-trade {
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .btn-buy {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-color: #10b981;
        }

        .btn-buy:hover {
            background-color: #10b981;
            color: white;
        }

        .btn-sell {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: #ef4444;
        }

        .btn-sell:hover {
            background-color: #ef4444;
            color: white;
        }

        #lastUpdateText {
            font-size: 0.85rem;
            color: #64748b;
            font-style: italic;
        }

        .alert-custom {
            background-color: #0f172a;
            border: 1px solid #ef4444;
            color: #ef4444;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="mb-5 text-center"><i class="bi bi-wallet2 text-danger"></i> Wallet App</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-fill me-2"></i> Ana Sayfa</a>
                    <a class="nav-link" href="transaction.html"><i class="bi bi-arrow-left-right me-2"></i> İşlem
                        Yap</a>
                    <a class="nav-link" href="history.html"><i class="bi bi-clock-history me-2"></i> İşlem Geçmişi</a>
                    <a class="nav-link active" href="#"><i class="bi bi-graph-up-arrow me-2"></i>Güncel Döviz
                        Kurları</a>
                    <hr class="text-secondary">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i
                            class="bi bi-box-arrow-left me-2"></i> Çıkış Yap</a>
                </nav>
            </div>

            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold"><i class="bi bi-currency-exchange text-danger me-2"></i> Yatırım & Döviz
                        </h2>
                        <p class="text-secondary">Merkez Bankası (TCMB) üzerinden anlık piyasa verileri</p>
                    </div>
                    <div class="text-end">
                        <button class="btn btn-outline-danger btn-sm mb-2" onclick="loadRates()">
                            <i class="bi bi-arrow-clockwise me-1"></i> Verileri Yenile
                        </button>
                        <div id="lastUpdateText">Yükleniyor...</div>
                    </div>
                </div>

                <div class="investment-card shadow-lg">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>KOD</th>
                                    <th>DÖVİZ CİNSİ</th>
                                    <th>ALIŞ (BUYING)</th>
                                    <th>SATIŞ (SELLING)</th>
                                    <th class="text-end pe-4">İŞLEMLER</th>
                                </tr>
                            </thead>
                            <tbody id="ratesTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = "https://localhost:5000";
        const token = localStorage.getItem('wallet_token');

        if (!token) window.location.href = "login.html";

        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

        async function loadRates() {
            const tbody = document.getElementById('ratesTableBody');
            const updateLabel = document.getElementById('lastUpdateText');

            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-danger" role="status"></div></td></tr>`;

            try {
                const response = await axios.get(`${API_BASE_URL}/api/InvestmentRate/rates`);
                const rates = response.data;

                tbody.innerHTML = "";

                if (!rates || rates.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-secondary">Veri bulunamadı.</td></tr>';
                    return;
                }

                rates.forEach(r => {
                    const fullName = getCurrencyFullName(r.currencyCode);
                    tbody.innerHTML += `
                        <tr>
                            <td><span class="currency-badge">${r.currencyCode}</span></td>
                            <td class="text-secondary fw-semibold">${fullName}</td>
                            <td><span class="rate-val text-success">₺${r.buyingRate.toLocaleString('tr-TR', { minimumFractionDigits: 4, maximumFractionDigits: 4 })}</span></td>
                            <td><span class="rate-val text-danger">₺${r.sellingRate.toLocaleString('tr-TR', { minimumFractionDigits: 4, maximumFractionDigits: 4 })}</span></td>
                            <td class="text-end pe-4">
                               <button class="btn btn-trade btn-buy me-2" onclick="openTradeModal('BUY', '${r.currencyCode}', ${r.sellingRate})">AL</button>
                               <button class="btn btn-trade btn-sell" onclick="openTradeModal('SELL', '${r.currencyCode}', ${r.buyingRate})">SAT</button>
                            </td>
                        </tr>
                    `;
                });

                updateLabel.innerText = `Son Güncelleme: ${new Date().toLocaleTimeString('tr-TR')}`;

            } catch (error) {
                console.error("API Hatası:", error);

                const errorMsg = error.response?.data?.Message || error.response?.data?.message || "Sunucuyla bağlantı kurulamadı.";

                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-5">
                            <div class="alert alert-custom d-inline-block">
                                <i class="bi bi-exclamation-octagon-fill me-2"></i>
                                <strong>Hata:</strong> ${errorMsg}
                            </div>
                        </td>
                    </tr>`;

                updateLabel.innerText = "Veri güncellenemedi.";
            }
        }

        function getCurrencyFullName(code) {
            const map = {
                'USD': 'Amerikan Doları',
                'EUR': 'Euro',
                'GBP': 'İngiliz Sterlini',
                'CHF': 'İsviçre Frangı',
                'JPY': 'Japon Yeni'
            };
            return map[code] || 'Yabancı Para Birimi';
        }


        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        window.onload = loadRates;


        let userWallets = [];

        // 1. Modalı Aç ve Hazırla
        async function openTradeModal(type, code, rate) {
            document.getElementById('tradeType').value = type;
            document.getElementById('currencyCode').value = code;
            document.getElementById('currentRate').value = rate;
            document.getElementById('tradeAmount').value = "";
            document.getElementById('totalCost').innerText = "0.00 ₺";
            document.getElementById('displayRate').innerText = `${rate.toFixed(4)} ₺`;

            const title = type === 'BUY' ? `${code} Alım İşlemi` : `${code} Satış İşlemi`;
            document.getElementById('tradeModalTitle').innerText = title;

            // Cüzdanları yükle
            await loadWalletsForTrade(type, code);

            const tradeModal = new bootstrap.Modal(document.getElementById('tradeModal'));
            tradeModal.show();
        }

        // 2. Filtreli Cüzdan Yükleme (Backend Kurallarımıza Göre)
        async function loadWalletsForTrade() {
            try {

                const response = await axios.get(`${API_BASE_URL}/api/Wallet/wallets`);
                userWallets = response.data;

                const sourceSelect = document.getElementById('sourceWalletSelect');
                const targetSelect = document.getElementById('targetWalletSelect');

                sourceSelect.innerHTML = '<option value="">Kaynak Cüzdan Seçiniz</option>';
                targetSelect.innerHTML = '<option value="">Hedef Cüzdan Seçiniz</option>';

                userWallets.forEach(w => {
                    const option = `<option value="${w.id}">${w.currency} - ${w.type} (Bakiye: ${w.balance})</option>`;
                    sourceSelect.innerHTML += option;
                    targetSelect.innerHTML += option;
                });
            } catch (err) {
                showTradeError("Cüzdanlar listelenirken bir hata oluştu.");
            }
        }

        function showTradeError(msg) {
            const alertDiv = document.getElementById('tradeErrorAlert');
            alertDiv.innerText = msg;
            alertDiv.classList.remove('d-none');
            // 5 saniye sonra hatayı gizle
            setTimeout(() => alertDiv.classList.add('d-none'), 5000);
        }

        // 3. Hesaplama (Anlık)
        function calculateTotal() {
            const amount = document.getElementById('tradeAmount').value;
            const rate = document.getElementById('currentRate').value;
            const total = amount * rate;
            document.getElementById('totalCost').innerText = `${total.toLocaleString('tr-TR', { minimumFractionDigits: 2 })} ₺`;
        }

        // 4. İşlemi Başlat (Backend'e Gönder)
        async function executeTrade() {
            const btn = document.getElementById('confirmTradeBtn');
            const alertDiv = document.getElementById('tradeErrorAlert');
            alertDiv.classList.add('d-none'); // Önceki hatayı temizle

            // Temel UI Kontrolü
            if (!document.getElementById('sourceWalletSelect').value || !document.getElementById('targetWalletSelect').value) {
                showTradeError("Lütfen kaynak ve hedef cüzdanları seçiniz.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "İşlem Yapılıyor...";

            const payload = {
                sourceWalletId: parseInt(document.getElementById('sourceWalletSelect').value),
                targetWalletId: parseInt(document.getElementById('targetWalletSelect').value),
                currencyCode: document.getElementById('currencyCode').value,
                amount: parseFloat(document.getElementById('tradeAmount').value),
                tradeType: document.getElementById('tradeType').value
            };

            try {
                const url = payload.tradeType === 'BUY' ? '/api/Trade/buy' : '/api/Trade/sell';
                await axios.post(`${API_BASE_URL}${url}`, payload);

                alert("İşlem başarıyla gerçekleşti!");
                location.reload();
            } catch (error) {
                // Backend'den gelen senin LocalizationHandler'ından geçmiş mesajı yakalıyoruz
                const msg = error.response?.data?.Message || error.response?.data?.message || "İşlem reddedildi.";
                showTradeError(msg); // Hata Modal üzerindeki kırmızı kartta görünecek
            } finally {
                btn.disabled = false;
                btn.innerText = "İşlemi Onayla";
            }
        }
    </script>

    <div class="modal fade" id="tradeModal" tabindex="-1" aria-hidden="true">
        <div id="tradeErrorAlert" class="alert alert-danger d-none small py-2" role="alert">
        </div>

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="tradeModalTitle">Döviz İşlemi</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="tradeForm">
                        <input type="hidden" id="tradeType">
                        <input type="hidden" id="currencyCode">
                        <input type="hidden" id="currentRate">

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Miktar</label>
                            <input type="number" class="form-control bg-dark text-white border-secondary"
                                id="tradeAmount" placeholder="0.00" step="0.01" required oninput="calculateTotal()">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Kaynak Cüzdan (Ödeme)</label>
                            <select class="form-select bg-dark text-white border-secondary" id="sourceWalletSelect"
                                required></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Hedef Cüzdan (Yatırılacak)</label>
                            <select class="form-select bg-dark text-white border-secondary" id="targetWalletSelect"
                                required></select>
                        </div>

                        <div class="p-3 rounded bg-secondary bg-opacity-10 border border-secondary mb-3">
                            <div class="d-flex justify-content-between small mb-1">
                                <span>Birim Kur:</span>
                                <span id="displayRate" class="fw-bold">0.00 ₺</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="fw-bold text-danger">Toplam Tutar:</span>
                                <span id="totalCost" class="fw-bold text-danger">0.00 ₺</span>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-danger w-100 mt-2" id="confirmTradeBtn"
                        onclick="executeTrade()">İşlemi Onayla</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
