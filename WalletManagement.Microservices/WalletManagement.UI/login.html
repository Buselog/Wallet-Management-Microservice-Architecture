<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Management System - Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            background: white;
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center">
        <div class="login-card">
            <h3 class="text-center mb-4">Cüzdan Sistemi</h3>
            <div id="alertBox" class="alert d-none"></div>

            <div class="mb-3">
                <label class="form-label">Email Adresi</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <input type="password" id="password" class="form-control" placeholder="******">
            </div>
            <button onclick="handleLogin()" class="btn btn-primary w-100 mb-3">Giriş Yap</button>
            <p class="text-center">Hesabın yok mu? <a href="register.html">Kayıt Ol</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const API_BASE_URL = "https://localhost:5000";

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            try {
                const response = await axios.post(`${API_BASE_URL}/api/Auth/login`, {
                    email: email,
                    password: password
                });

                const token = response.data.token;
                localStorage.setItem('wallet_token', token);

                alertBox.className = "alert alert-success";
                alertBox.innerText = "Giriş başarılı! Yönlendiriliyorsunuz...";
                alertBox.classList.remove('d-none');

                setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);

            } catch (error) {
                alertBox.className = "alert alert-danger";
                alertBox.innerText = error.response?.data?.Message || "Giriş başarısız!";
                alertBox.classList.remove('d-none');
            }
        }
    </script>

</body>

</html>
