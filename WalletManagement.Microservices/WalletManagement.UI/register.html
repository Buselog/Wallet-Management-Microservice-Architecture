<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Wallet Management System - Register Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center">
        <div class="register-card">
            <h3 class="text-center mb-4">Yeni Hesap Oluştur</h3>
            <div id="alertBox" class="alert d-none"></div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Ad</label>
                    <input type="text" id="firstName" class="form-control" placeholder="Ahmet">
                    <div id="error_firstname" class="error-msg"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Soyad</label>
                    <input type="text" id="lastName" class="form-control" placeholder="Yılmaz">
                    <div id="error_lastname" class="error-msg"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" id="email" class="form-control" placeholder="ahmet@mail.com">
                <div id="error_email" class="error-msg"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Telefon (5xx...)</label>
                <input type="text" id="phone" class="form-control" placeholder="555 444 33 22">
                <div id="error_phonenumber" class="error-msg"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Şifre</label>
                <input type="password" id="password" class="form-control" placeholder="******">
                <div id="error_password" class="error-msg"></div>
            </div>

            <button onclick="handleRegister()" class="btn btn-success w-100 mb-3 fw-bold">Kayıt Ol ve Cüzdan
                Oluştur</button>
            <p class="text-center mb-0 text-secondary">Zaten hesabın var mı? <a href="login.html"
                    class="text-decoration-none">Giriş Yap</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE_URL = "https://localhost:5000";

        async function handleRegister() {
            const alertBox = document.getElementById('alertBox');

            const data = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phoneNumber: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };

            alertBox.classList.add('d-none');
            document.querySelectorAll('.error-msg').forEach(el => {
                el.innerText = '';
                el.style.display = 'none';
            });

            try {
                const response = await axios.post(`${API_BASE_URL}/api/Auth/register`, data);

                alertBox.className = "alert alert-success";
                alertBox.innerText = (response.data.message || response.data) + " Giriş sayfasına yönlendiriliyorsunuz...";
                alertBox.classList.remove('d-none');

                setTimeout(() => { window.location.href = "login.html"; }, 2000);

            } catch (error) {
                const errorData = error.response?.data;

                if (errorData && errorData.ValidationErrors) {
                    for (const [key, messages] of Object.entries(errorData.ValidationErrors)) {
                        const errorDiv = document.getElementById(`error_${key.toLowerCase()}`);
                        if (errorDiv) {
                            errorDiv.innerText = messages[0];
                            errorDiv.style.display = 'block';
                        }
                    }
                }
                else {
                    alertBox.className = "alert alert-danger";
                    alertBox.innerText = errorData?.Message || "Kayıt işlemi başarısız!";
                    alertBox.classList.remove('d-none');
                }
            }
        }
    </script>

</body>

</html>
