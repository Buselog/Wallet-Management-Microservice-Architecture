<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Wallet Management System - Register Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center">
        <div class="register-card">
            <h3 class="text-center mb-4">Yeni Hesap Oluştur</h3>
            <div id="alertBox" class="alert d-none"></div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ad</label>
                    <input type="text" id="firstName" class="form-control" placeholder="Ahmet">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Soyad</label>
                    <input type="text" id="lastName" class="form-control" placeholder="Yılmaz">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="ahmet@mail.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Telefon (5xx...)</label>
                <input type="text" id="phone" class="form-control" placeholder="555 444 33 22">
            </div>
            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <input type="password" id="password" class="form-control" placeholder="******">
            </div>

            <button onclick="handleRegister()" class="btn btn-success w-100 mb-3">Kayıt Ol ve Cüzdan Oluştur</button>
            <p class="text-center">Zaten hesabın var mı? <a href="login.html">Giriş Yap</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE_URL = "https://localhost:5000";

        async function handleRegister() {
            const data = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phoneNumber: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };

            const alertBox = document.getElementById('alertBox');

            try {
                const response = await axios.post(`${API_BASE_URL}/api/Auth/register`, data);

                alertBox.className = "alert alert-success";
                alertBox.innerText = response.data + " Giriş sayfasına yönlendiriliyorsunuz...";
                alertBox.classList.remove('d-none');

                setTimeout(() => { window.location.href = "login.html"; }, 2000);

            } catch (error) {
                alertBox.className = "alert alert-danger";
                alertBox.innerText = error.response?.data?.Message || "Kayıt işlemi başarısız!";
                alertBox.classList.remove('d-none');
            }
        }
    </script>

</body>

</html>
