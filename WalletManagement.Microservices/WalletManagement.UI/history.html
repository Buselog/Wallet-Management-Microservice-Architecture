<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Wallet App - İşlem Geçmişi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .sidebar {
            background-color: #1e293b;
            min-height: 100vh;
            padding: 20px;
            border-right: 1px solid #334155;
        }

        .nav-link {
            color: #94a3b8;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .nav-link.active {
            background-color: #ef4444;
            color: white;
        }

        .history-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #334155;
        }

        .table {
            color: #f8fafc;
            border-color: #334155;
        }

        .table thead th {
            border-bottom: 2px solid #334155;
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .table tbody tr {
            border-bottom: 1px solid #334155;
            transition: 0.2s;
        }

        .table tbody tr:hover {
            background-color: #0f172a;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-deposit {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .status-withdraw {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .amount-pos {
            color: #10b981;
            font-weight: 600;
        }

        .amount-neg {
            color: #ef4444;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
        }

        .page-link {
            background-color: #1e293b;
            border-color: #334155;
            color: #94a3b8;
        }

        .page-item.active .page-link {
            background-color: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        .wallet-btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 10px;
            margin-right: 10px;
            transition: 0.3s;
        }

        .wallet-btn.active {
            background-color: #ef4444;
            color: white;
            border-color: #ef4444;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="mb-5 text-center"><i class="bi bi-wallet2 text-danger"></i> Wallet App</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-fill me-2"></i> Ana Sayfa</a>
                    <a class="nav-link" href="transaction.html"><i class="bi bi-arrow-left-right me-2"></i> İşlem
                        Yap</a>
                    <a class="nav-link active" href="history.html"><i class="bi bi-clock-history me-2"></i> İşlem
                        Geçmişi</a>
                    <hr class="text-secondary">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i
                            class="bi bi-box-arrow-left me-2"></i> Çıkış Yap</a>
                </nav>
            </div>

            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2><i class="bi bi-list-ul text-danger"></i> İşlem Geçmişi</h2>
                        <p class="text-secondary">Cüzdan hareketlerini saniye bazlı takip edin</p>
                    </div>
                    <div class="d-flex gap-2 align-items-end">
                        <div>
                            <small class="text-danger d-block mb-1 fw-bold">BAŞLANGIÇ TARİHİ</small>
                            <input type="date" id="startDate" class="form-control" onchange="loadHistory(1)">
                        </div>
                        <div>
                            <small class="text-danger d-block mb-1 fw-bold">BİTİŞ TARİHİ</small>
                            <input type="date" id="endDate" class="form-control" onchange="loadHistory(1)">
                        </div>
                    </div>
                </div>

                <div class="mb-4" id="walletButtons">
                </div>

                <div class="history-card shadow">
                    <table class="table mb-4">
                        <thead>
                            <tr>
                                <th>TARİH</th>
                                <th>İŞLEM TÜRÜ</th>
                                <th>MİKTAR</th>
                                <th>REFERANS NO</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                        </tbody>
                    </table>

                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-secondary" id="recordCount">TOPLAM 0 KAYIT</small>
                        <nav>
                            <ul class="pagination mb-0" id="pagination">
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE_URL = "https://localhost:5000";
        const token = localStorage.getItem('wallet_token');
        let selectedWalletId = null;
        const pageSize = 3;

        if (!token) window.location.href = "login.html";
        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

        async function loadInitialData() {
            try {
                const response = await axios.get(`${API_BASE_URL}/api/Wallet/wallets/`);
                const wallets = response.data;
                const btnContainer = document.getElementById('walletButtons');

                if (wallets.length > 0) {
                    wallets.forEach((w, index) => {
                        const btn = document.createElement('button');
                        btn.className = `wallet-btn ${index === 0 ? 'active' : ''}`;
                        btn.id = `btn-${w.id}`;
                        btn.innerText = `Cüzdan #${w.id}`;
                        btn.onclick = () => {
                            document.querySelectorAll('.wallet-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            selectedWalletId = w.id;
                            loadHistory(1);
                        };
                        btnContainer.appendChild(btn);
                    });
                    selectedWalletId = wallets[0].id;
                    loadHistory(1);
                }
            } catch (error) { console.error(error); }
        }

        async function loadHistory(page) {
            if (!selectedWalletId) return;

            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const tbody = document.getElementById('historyBody');

            try {
                const response = await axios.get(`${API_BASE_URL}/api/WalletTransaction/history/${selectedWalletId}`, {
                    params: {
                        startDate: start || null,
                        endDate: end || null,
                        pageNumber: page,
                        pageSize: pageSize
                    }
                });

                const { items, totalCount } = response.data;
                tbody.innerHTML = "";

                items.forEach(item => {
                    const isDeposit = item.type.toLowerCase().includes('deposit') || item.amount > 0;
                    const date = new Date(item.transactionDate).toLocaleString('tr-TR');

                    tbody.innerHTML += `
                    <tr>
                        <td class="text-secondary">${date}</td>
                        <td>
                            <span class="status-dot ${isDeposit ? 'status-deposit' : 'status-withdraw'}"></span>
                            <span class="fw-bold">${item.type.toUpperCase()}</span>
                        </td>
                        <td class="${isDeposit ? 'amount-pos' : 'amount-neg'}">
                            ${isDeposit ? '+' : ''} ₺${item.amount.toLocaleString('tr-TR')}
                        </td>
                        <td class="text-secondary small font-monospace">${item.referenceId}</td>
                    </tr>
                `;
                });

                document.getElementById('recordCount').innerText = `TOPLAM ${totalCount} KAYIT`;
                setupPagination(totalCount, page);

            } catch (error) {
                console.error("Geçmiş yüklenemedi", error);
            }
        }

        function setupPagination(total, current) {
            const totalPages = Math.ceil(total / pageSize);
            const nav = document.getElementById('pagination');
            nav.innerHTML = "";

            for (let i = 1; i <= totalPages; i++) {
                nav.innerHTML += `
                <li class="page-item ${i === current ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadHistory(${i})">${i}</a>
                </li>
            `;
            }
        }

        function logout() {
            localStorage.removeItem('wallet_token');
            window.location.href = "login.html";
        }

        loadInitialData();
    </script>
</body>

</html>
