<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet App - İşlem Merkezi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .sidebar {
            background-color: #1e293b;
            min-height: 100vh;
            padding: 20px;
            border-right: 1px solid #334155;
        }

        .nav-link {
            color: #94a3b8;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-link:hover {
            background-color: #334155;
            color: white;
        }

        .nav-link.active {
            background-color: #ef4444;
            color: white;
        }

        .action-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .form-control,
        .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 12px;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #0f172a;
            color: white;
            border-color: #ef4444;
            box-shadow: none;
        }

        .btn-action {
            padding: 15px;
            font-weight: 600;
            border-radius: 12px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .wallet-info-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #ef4444;
            transition: 0.3s;
        }

        .input-group-text {
            background-color: #334155;
            border: 1px solid #334155;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="mb-5 text-center"><i class="bi bi-wallet2 text-danger"></i> Wallet App</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-fill me-2"></i> Ana Sayfa</a>
                    <a class="nav-link active" href="transaction.html"><i class="bi bi-arrow-left-right me-2"></i> İşlem
                        Yap</a>
                    <a class="nav-link" href="history.html"><i class="bi bi-clock-history me-2"></i> İşlem Geçmişi</a>
                    <hr class="text-secondary">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i
                            class="bi bi-box-arrow-left me-2"></i> Çıkış Yap</a>
                </nav>
            </div>

            <div class="col-md-10 p-4">
                <div class="max-width-container mx-auto" style="max-width: 800px;">
                    <h2 class="mb-2">İşlem Merkezi</h2>
                    <p class="text-secondary mb-4">Güvenli ve hızlı varlık yönetimi</p>

                    <div class="action-card">
                        <div class="mb-4">
                            <label class="form-label text-secondary fw-bold">1. Kaynak Cüzdan Seçimi</label>
                            <select id="fromWallet" class="form-select form-select-lg" onchange="updateWalletDisplay()">
                                <option value="">İşlem yapılacak cüzdanı seçin...</option>
                            </select>
                            <div id="selectedWalletInfo" class="wallet-info-box mt-3 d-none">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <small class="text-secondary d-block">SEÇİLİ CÜZDAN BAKİYESİ</small>
                                        <h3 id="currentBalance" class="mb-0 text-white">₺0.00</h3>
                                    </div>
                                    <i class="bi bi-shield-check text-success fs-2"></i>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 text-center">
                            <label class="form-label text-secondary fw-bold d-block text-start">2. İşlem Türü</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="actionType" id="typeDeposit" value="deposit"
                                    checked onclick="toggleFields()">
                                <label class="btn btn-outline-success py-3" for="typeDeposit"><i
                                        class="bi bi-plus-circle me-2"></i>Yatır</label>

                                <input type="radio" class="btn-check" name="actionType" id="typeWithdraw"
                                    value="withdraw" onclick="toggleFields()">
                                <label class="btn btn-outline-warning py-3" for="typeWithdraw"><i
                                        class="bi bi-dash-circle me-2"></i>Çek</label>

                                <input type="radio" class="btn-check" name="actionType" id="typeTransfer"
                                    value="transfer" onclick="toggleFields()">
                                <label class="btn btn-outline-danger py-3" for="typeTransfer"><i
                                        class="bi bi-send me-2"></i>Transfer</label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary fw-bold">Tutar</label>
                                <div class="input-group">
                                    <span class="input-group-text">₺</span>
                                    <input type="number" id="amount" class="form-control form-control-lg"
                                        placeholder="0.00">
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary fw-bold">Referans No</label>
                                <input type="text" id="referenceId" class="form-control form-control-lg"
                                    placeholder="REF-001">
                            </div>
                        </div>

                        <div id="transferFields" class="d-none mt-3 p-3 border border-secondary rounded-3">
                            <div class="mb-3">
                                <label class="form-label text-secondary fw-bold">Alıcı (IBAN veya Telefon No)</label>
                                <input type="text" id="target" class="form-control" placeholder="TR... veya 05xx...">
                                <small class="text-muted"><i class="bi bi-info-circle me-1"></i>IBAN veya Telefon
                                    numarasını dilediğiniz formatta yazabilirsiniz.</small>
                            </div>
                            <div class="mb-0">
                                <label class="form-label text-secondary fw-bold">İşlem Açıklaması</label>
                                <input type="text" id="description" class="form-control"
                                    placeholder="Örn: Kira Ödemesi">
                            </div>
                        </div>

                        <button onclick="processAction()" id="btnAction"
                            class="btn btn-danger w-100 btn-action mt-4 shadow">
                            İŞLEMİ ONAYLA VE GERÇEKLEŞTİR
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const API_BASE_URL = "https://localhost:5000";
        const token = localStorage.getItem('wallet_token');
        let userWallets = [];

        if (!token) window.location.href = "login.html";
        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

        async function fetchWallets() {
            try {
                const response = await axios.get(`${API_BASE_URL}/api/Wallet/wallets/`);
                userWallets = response.data;
                const select = document.getElementById('fromWallet');

                const preSelectedId = localStorage.getItem('selected_wallet_id');

                userWallets.forEach(w => {

                    const wId = w.id || w.Id;
                    const wCurr = w.currency || w.Currency;

                    const isSelected = (preSelectedId && preSelectedId == wId) ? "selected" : "";
                    select.innerHTML += `<option value="${wId}" ${isSelected}>${wCurr} Cüzdanı (ID: ${wId})</option>`;
                });

                if (preSelectedId) updateWalletDisplay();
            } catch (error) {
                console.error("Cüzdanlar yüklenemedi:", error);
            }
        }

        function updateWalletDisplay() {
            const walletId = document.getElementById('fromWallet').value;
            const infoBox = document.getElementById('selectedWalletInfo');
            if (walletId) {
                const wallet = userWallets.find(x => (x.id || x.Id) == walletId);
                if (wallet) {
                    const balance = wallet.balance ?? wallet.Balance ?? 0;
                    document.getElementById('currentBalance').innerText = `₺${balance.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}`;
                    infoBox.classList.remove('d-none');
                }
            } else {
                infoBox.classList.add('d-none');
            }
        }

        function toggleFields() {
            const type = document.querySelector('input[name="actionType"]:checked').value;
            const transferFields = document.getElementById('transferFields');
            transferFields.className = (type === 'transfer') ? "mt-3 p-3 border border-secondary rounded-3" : "d-none";
        }

        async function processAction() {
            const type = document.querySelector('input[name="actionType"]:checked').value;
            const walletId = document.getElementById('fromWallet').value;
            const amount = document.getElementById('amount').value;
            const referenceId = document.getElementById('referenceId').value;

            if (!walletId || !amount || !referenceId) {
                alert("Lütfen zorunlu alanları doldurunuz.");
                return;
            }

            if (!confirm("Bu işlemi onaylıyor musunuz?")) return;

            let endpoint = `${API_BASE_URL}/api/Wallet/${type}`;
            let payload = {};

            if (type === 'transfer') {
                payload = {
                    FromWalletId: parseInt(walletId),
                    Target: document.getElementById('target').value,
                    Amount: parseFloat(amount),
                    Description: document.getElementById('description').value,
                    ReferenceId: referenceId
                };
            } else {
                payload = {
                    WalletId: parseInt(walletId),
                    Amount: parseFloat(amount),
                    ReferenceId: referenceId
                };
            }

            try {
                const response = await axios.post(endpoint, payload);
                alert(response.data.message || response.data.Message || "İşlem başarıyla tamamlandı.");

                localStorage.removeItem('selected_wallet_id');
                window.location.href = "dashboard.html";
            } catch (error) {
                const errorData = error.response?.data;
                const backendError = errorData?.message || errorData?.Message || "Sistemsel bir hata oluştu.";
                alert("Hata: " + backendError);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        fetchWallets();
    </script>

</body>

</html>
