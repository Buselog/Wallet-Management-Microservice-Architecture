<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Wallet App - Ana Sayfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .sidebar {
            background-color: #1e293b;
            min-height: 100vh;
            padding: 20px;
        }

        .nav-link {
            color: #94a3b8;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .nav-link.active {
            background-color: #ef4444;
            color: white;
        }

        .stat-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
        }

        .wallet-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #334155;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .wallet-card:hover {
            transform: translateY(-5px);
            border-color: rgba(239, 68, 68, 0.5);
        }

        .wallet-card.selected {
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #94a3b8;
            cursor: pointer;
            z-index: 10;
        }

        .delete-btn:hover {
            color: #ef4444;
        }

        .currency-badge {
            background: #334155;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .modal-content {
            background-color: #1e293b;
            color: white;
            border: 1px solid #334155;
        }

        .form-control,
        .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="mb-5"><i class="bi bi-wallet2 text-danger"></i> Wallet App</h4>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="#"><i class="bi bi-grid-fill me-2"></i> Ana Sayfa</a>
                    <a class="nav-link" href="transaction.html"><i class="bi bi-arrow-left-right me-2"></i> İşlem
                        Yap</a>
                    <a class="nav-link" href="history.html"><i class="bi bi-clock-history me-2"></i> İşlem Geçmişi</a>
                    <hr class="text-secondary">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i
                            class="bi bi-box-arrow-left me-2"></i> Çıkış Yap</a>
                </nav>
            </div>

            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 id="welcomeText">Hoş Geldiniz</h2>
                        <p class="text-secondary">Varlıklarınızın güncel dağılımı</p>
                    </div>
                    <button class="btn btn-danger px-4 py-2" data-bs-toggle="modal" data-bs-target="#newWalletModal">
                        <i class="bi bi-plus-lg me-2"></i> Yeni Cüzdan
                    </button>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-4">
                        <div class="stat-card">
                            <small class="text-secondary">TOPLAM BAKİYE (TRY Eşdeğeri)</small>
                            <h2 id="totalBalance" class="mt-2">₺0</h2>
                        </div>
                    </div>
                </div>

                <h4 class="mb-4">Cüzdanlarım <small class="text-muted" style="font-size: 0.9rem;">(Seçmek için
                        tıklayın)</small></h4>
                <div class="row g-4" id="walletContainer">
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="newWalletModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Yeni Cüzdan Oluştur</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-secondary">Cüzdan Tipi</label>
                        <select id="walletType" class="form-select">
                            <option value="1">Vadesiz (Checking)</option>
                            <option value="2">Vadeli (Saving)</option>
                            <option value="3">Yatırım (Investment)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary">Para Birimi</label>
                        <input type="text" id="currency" class="form-control" placeholder="Örn: TRY, USD, EUR"
                            maxlength="3">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-danger px-4" onclick="createNewWallet()">Oluştur</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = "https://localhost:5000";
        const token = localStorage.getItem('wallet_token');
        const fullName = localStorage.getItem('user_fullname');

        if (!token) window.location.href = "login.html";
        if (fullName) document.getElementById('welcomeText').innerText = `Hoş Geldiniz, ${fullName}`;

        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

        async function loadWallets() {
            try {
                const response = await axios.get(`${API_BASE_URL}/api/Wallet/wallets/`);
                const wallets = response.data;
                const container = document.getElementById('walletContainer');
                let total = 0;

                container.innerHTML = "";
                wallets.forEach(w => {
                    total += w.Balance;

                    container.innerHTML += `
                <div class="col-md-4">
                    <div class="wallet-card" id="card-${w.Id}" onclick="selectWallet(${w.Id})">
                        <i class="bi bi-trash delete-btn" onclick="event.stopPropagation(); deleteWallet(${w.Id})"></i>
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <small class="text-secondary d-block">BİREYSEL CÜZDAN</small>
                                <span class="currency-badge mt-1">${w.Currency}</span>
                            </div>
                            <small class="text-secondary">ID: #${w.Id}</small>
                        </div>
                        <h3 class="mb-0">₺${w.Balance.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}</h3>
                        <small class="text-muted mt-2 d-block">${getWalletTypeName(w.Type)}</small>
                    </div>
                </div>`;
                });

                document.getElementById('totalBalance').innerText = `₺${total.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}`;

            } catch (error) {
                console.error("Cüzdanlar yüklenemedi", error);
                if (error.response?.status === 401) logout();
            }
        }

        function selectWallet(walletId) {
            document.querySelectorAll('.wallet-card').forEach(card => card.classList.remove('selected'));
            document.getElementById(`card-${walletId}`).classList.add('selected');
            localStorage.setItem('selected_wallet_id', walletId);
        }

        function getWalletTypeName(type) {
            const types = { 1: 'Vadesiz', 2: 'Vadeli', 3: 'Yatırım' };
            return types[type] || 'Bilinmiyor';
        }

        async function createNewWallet() {
            const type = document.getElementById('walletType').value;
            const currency = document.getElementById('currency').value.toUpperCase();

            try {
                await axios.post(`${API_BASE_URL}/api/Wallet/create`, {
                    Currency: currency,
                    Type: parseInt(type)
                });
                location.reload();
            } catch (error) {
                alert(error.response?.data?.Message || "Cüzdan oluşturulamadı.");
            }
        }

        async function deleteWallet(id) {
            if (!confirm("Bu cüzdanı kapatmak istediğinize emin misiniz?")) return;
            try {
                await axios.delete(`${API_BASE_URL}/api/Wallet/${id}/delete`);
                loadWallets();
            } catch (error) {
                alert(error.response?.data?.Message || "Silme işlemi başarısız.");
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        loadWallets();
    </script>
</body>

</html>
