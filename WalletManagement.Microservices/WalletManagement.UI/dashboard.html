<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Wallet App - Ana Sayfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .sidebar {
            background-color: #1e293b;
            min-height: 100vh;
            padding: 20px;
            border-right: 1px solid #334155;
        }

        .nav-link {
            color: #94a3b8;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-link.active {
            background-color: #ef4444;
            color: white;
        }

        .stat-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #334155;
        }

        .wallet-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #334155;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .wallet-card:hover {
            transform: translateY(-5px);
            border-color: rgba(239, 68, 68, 0.5);
        }

        .wallet-card.selected {
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        .wallet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .wallet-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .delete-btn {
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
        }

        .delete-btn:hover {
            color: #ef4444;
        }

        .currency-badge {
            background: #334155;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .modal-content {
            background-color: #1e293b;
            color: white;
            border: 1px solid #334155;
        }

        .form-control,
        .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }

        .helper-text {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="mb-5"><i class="bi bi-wallet2 text-danger"></i> Wallet App</h4>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="#"><i class="bi bi-grid-fill me-2"></i> Ana Sayfa</a>
                    <a class="nav-link" href="transaction.html"><i class="bi bi-arrow-left-right me-2"></i> İşlem
                        Yap</a>
                    <a class="nav-link" href="history.html"><i class="bi bi-clock-history me-2"></i> İşlem Geçmişi</a>
                    <hr class="text-secondary">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i
                            class="bi bi-box-arrow-left me-2"></i> Çıkış Yap</a>
                </nav>
            </div>

            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 id="welcomeText">Hoş Geldiniz</h2>
                        <p class="text-secondary">Varlıklarınızın güncel dağılımı</p>
                    </div>
                    <button class="btn btn-danger px-4 py-2 shadow" data-bs-toggle="modal"
                        data-bs-target="#newWalletModal">
                        <i class="bi bi-plus-lg me-2"></i> Yeni Cüzdan
                    </button>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-4">
                        <div class="stat-card shadow-sm">
                            <small id="totalBalanceLabel" class="text-secondary fw-bold">TOPLAM BAKİYE</small>
                            <h2 id="totalBalance" class="mt-2 text-white">₺0,00</h2>
                        </div>
                    </div>
                </div>

                <h4 class="mb-4">Cüzdanlarım <small class="helper-text ml-2">(Seçmek için kartın üzerine
                        tıklayın)</small></h4>
                <div class="row g-4" id="walletContainer"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="newWalletModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content p-3 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Yeni Cüzdan Oluştur</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalAlert" class="alert alert-danger d-none" style="font-size: 0.9rem;"></div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Cüzdan Tipi</label>
                        <select id="walletType" class="form-select">
                            <option value="">Seçiniz...</option>
                            <option value="1">Vadesiz Hesap (Checking)</option>
                            <option value="2">Vadeli Hesap (Saving)</option>
                            <option value="3">Yatırım Hesabı (Investment)</option>
                        </select>
                        <div id="error_type" class="error-msg"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Para Birimi</label>
                        <input type="text" id="currency" class="form-control" placeholder="Örn: TRY, USD">
                        <div id="error_currency" class="error-msg"></div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" id="createBtn" class="btn btn-danger px-4 fw-bold"
                        onclick="createNewWallet()">Oluştur</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = "https://localhost:5000";
        const token = localStorage.getItem('wallet_token');
        const fullName = localStorage.getItem('user_fullname');

        if (!token) window.location.href = "login.html";
        if (fullName) document.getElementById('welcomeText').innerText = `Hoş Geldiniz, ${fullName}`;

        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

        function getCustomerNoFromToken(t) {
            try {
                const base64Url = t.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                const decoded = JSON.parse(jsonPayload);
                return decoded.CustomerNo || decoded.customerno;
            } catch (e) { return null; }
        }

        async function loadWallets() {
            try {
                const response = await axios.get(`${API_BASE_URL}/api/Wallet/wallets/`);
                const wallets = response.data;
                const container = document.getElementById('walletContainer');
                let total = 0;
                let lastCurrency = "TRY";

                container.innerHTML = "";
                wallets.forEach(w => {
                    const wId = w.id || w.Id;
                    const wBalance = w.balance ?? w.Balance ?? 0;
                    const wCurrency = w.currency || w.Currency || "TRY";
                    const wTypeName = w.typeName || w.TypeName || "Cüzdan";

                    total += wBalance;
                    lastCurrency = wCurrency;
                    const symbol = (wCurrency === 'TRY') ? "₺" : wCurrency;

                    container.innerHTML += `
                <div class="col-md-4">
                    <div class="wallet-card" id="card-${wId}" onclick="selectWallet(${wId})">
                        <div class="wallet-header">
                            <div>
                                <small class="text-secondary d-block fw-bold">${wTypeName.toUpperCase()}</small>
                                <span class="currency-badge mt-1">${wCurrency}</span>
                            </div>
                            <div class="wallet-controls">
                                <small class="text-secondary fw-bold">#${wId}</small>
                                <i class="bi bi-trash delete-btn" onclick="event.stopPropagation(); deleteWallet(${wId})"></i>
                            </div>
                        </div>
                        <h3 class="mb-0">${symbol} ${wBalance.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}</h3>
                    </div>
                </div>`;
                });

                const totalSymbol = (lastCurrency === 'TRY') ? "₺" : lastCurrency;
                document.getElementById('totalBalanceLabel').innerText = `TOPLAM BAKİYE (${lastCurrency} Eşdeğeri)`;
                document.getElementById('totalBalance').innerText = `${totalSymbol} ${total.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}`;

            } catch (error) { console.error(error); }
        }

        async function createNewWallet() {
            const typeSelect = document.getElementById('walletType');
            const currencyInput = document.getElementById('currency');
            const alertBox = document.getElementById('modalAlert');

            alertBox.classList.add('d-none');
            document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');

            const payload = {
                customerNo: getCustomerNoFromToken(token),
                currency: currencyInput.value.trim(),
                type: typeSelect.value ? parseInt(typeSelect.value) : null
            };

            try {
                await axios.post(`${API_BASE_URL}/api/Wallet/create`, payload);
                location.reload();
            } catch (error) {
                const errorData = error.response?.data;
                if (errorData?.errors) {
                    for (const [key, messages] of Object.entries(errorData.errors)) {
                        const div = document.getElementById(`error_${key.toLowerCase()}`);
                        if (div) { div.innerText = messages[0]; div.style.display = 'block'; }
                    }
                } else {
                    const msg = errorData?.Message || errorData?.message || "Cüzdan oluşturulamadı.";
                    alertBox.innerText = msg;
                    alertBox.classList.remove('d-none');
                }
            }
        }

        function selectWallet(walletId) {
            document.querySelectorAll('.wallet-card').forEach(card => card.classList.remove('selected'));
            const target = document.getElementById(`card-${walletId}`);
            if (target) target.classList.add('selected');
            localStorage.setItem('selected_wallet_id', walletId);
        }

        async function deleteWallet(id) {
            if (!confirm("Bu cüzdanı kapatmak istediğinize emin misiniz?")) return;
            try {
                await axios.delete(`${API_BASE_URL}/api/Wallet/${id}/delete`);
                loadWallets();
            } catch (error) {
                alert(error.response?.data?.Message || "Silme başarısız.");
            }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        window.onload = loadWallets;
    </script>
</body>

</html>
